name: Android CI - Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GRADLE_USER_HOME: ${{ runner.temp }}/.gradle
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Setup Android SDK (install build-tools & platforms)
        uses: r0adkll/setup-android@v2
        with:
          api-level: 33
          build-tools: 33.0.2

      - name: Accept licenses
        run: yes | sdkmanager --licenses

      - name: Decode keystore (optional, only if signing)
        if: secrets.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > release-keystore.jks

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Zipalign APK
        if: always()
        run: |
          mkdir -p out
          BUILD_APK=app/build/outputs/apk/release/app-release-unsigned.apk
          # If your Gradle already outputs a signed release APK, adjust path accordingly.
          ${ANDROID_HOME}/build-tools/33.0.2/zipalign -v -p 4 "$BUILD_APK" out/app-release-aligned.apk

      - name: Sign APK (if keystore provided)
        if: secrets.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          ${ANDROID_HOME}/build-tools/33.0.2/apksigner sign \
            --ks release-keystore.jks \
            --ks-pass pass:$KEYSTORE_PASS \
            --ks-key-alias $KEY_ALIAS \
            --key-pass pass:$KEY_PASS \
            out/app-release-aligned.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v3
        with:
          name: app-release-apk
          path: out/app-release-aligned.apk